# Exercice 4 — Le Service qui donne une adresse stable à vos pods.
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  type: ClusterIP
  selector:
    app: site          # les pods qui reçoivent le trafic
  ports:
    - name: http
      port: 80         # port du Service
      targetPort: 80   # port du conteneur
